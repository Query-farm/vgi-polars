name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      vgi_python_ref:
        description: >-
          git ref (tag/branch/sha) of Query-farm/vgi-python to test against.
          Defaults to the pinned tag below when left blank.
        required: false
        default: ""

# vgi-polars depends on vgi-python via a LOCAL SIBLING checkout
# ([tool.uv.sources] in pyproject.toml, path = "../vgi-python"), not the
# published PyPI release — this repo tracks vgi-python's client-side surface
# as both develop together, the same way vgi-spark's settings.gradle.kts
# composite-builds a sibling vgi-java checkout. CI therefore checks out BOTH
# repos as siblings under the same workspace root, exactly mirroring local
# dev's ~/Development/vgi-polars + ~/Development/vgi-python layout.
#
# Pinned (not `main`) for the same reason ~/Development/vgi's CI pins
# VGI_FIXTURES_REF to a release tag: a protocol/fixture change landing on
# vgi-python's main would otherwise silently flip this repo's CI red with no
# change on this side. Bump VGI_PYTHON_REF in lockstep with real vgi-python
# API usage changes here; override per-run via the workflow_dispatch input.
env:
  VGI_PYTHON_REF: v0.31.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - run: uvx ruff format --check src/ tests/
      - run: uvx ruff check src/ tests/

  build:
    name: Build & validate package metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # Builds against the plain `vgi-python>=...` dependency bound in
      # pyproject.toml (PyPI), not the [tool.uv.sources] sibling-checkout dev
      # override — proves the package a `release.yml` run would publish
      # actually builds and has valid metadata, on every push/PR, not just
      # at release time.
      - name: Build (sdist + wheel)
        run: uv build --sdist --wheel --out-dir dist .
      - name: Validate metadata
        run: uvx twine check dist/*

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vgi-polars
        uses: actions/checkout@v7
        with:
          path: vgi-polars

      - name: Checkout vgi-python (sibling)
        uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-python
          ref: ${{ github.event.inputs.vgi_python_ref || env.VGI_PYTHON_REF }}
          path: vgi-python
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      # --extra http: falcon/waitress, needed for vgi-fixture-http to serve.
      # The workspace `dev` group (synced by default) is what actually
      # provides the vgi-fixture-worker/vgi-fixture-http console scripts.
      - name: Sync vgi-python
        working-directory: vgi-python
        run: uv sync --extra http

      - name: Sync vgi-polars
        working-directory: vgi-polars
        run: uv sync

      # Needs the full sibling-checkout environment (vgi-python's types, not
      # just vgi-polars' own code) to resolve imports, so it lives in this
      # job rather than `lint` — mirrors vgi-python's own "Type check (mypy)"
      # CI step, just riding this job's existing sibling setup instead of a
      # dedicated one.
      - name: Type check (mypy)
        working-directory: vgi-polars
        run: uv run mypy src/

      # Docstring consistency (pydoclint) runs inside the pytest suite via
      # tests/test_docstrings.py, mirroring vgi-python — not a separate step.
      - name: Run tests
        working-directory: vgi-polars
        env:
          VGI_PYTHON: ${{ github.workspace }}/vgi-python
        run: uv run pytest -v --cov=vgi_polars --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: vgi-polars/coverage.xml

  test-min-versions:
    name: Test against declared minimum dependency versions
    runs-on: ubuntu-latest
    # `uv sync` (the `test` job above) always resolves to the NEWEST version
    # satisfying each dependency constraint, never the oldest -- so a
    # declared floor like "polars>=1.31" was never actually exercised at
    # 1.31, only ever tested against whatever was newest at CI-run time.
    # That gap is exactly where a real bug shipped silently: _row_transform.py
    # used DataFrame.gather() (added in Polars ~1.41) while the floor still
    # claimed 1.31 was enough, and pyarrow>=17 turned out to have no cp313
    # wheel at all against this package's own requires-python>=3.13 -- both
    # found by a user hitting a real Colab install sitting in that untested
    # gap, not by this CI. `--resolution lowest-direct` closes it: install
    # this package (+ its `http` extra) resolving every DIRECT dependency to
    # its lowest allowed version (transitive deps stay at a normal/compatible
    # resolution, so this isn't "oldest possible everything," just "the
    # floor we actually claim to support"), then run the real test suite
    # against that environment. A regression here means the declared minimum
    # in pyproject.toml is a lie, not that the code has a logic bug --
    # bumping the floor is usually the fix, not chasing compatibility shims.
    steps:
      - name: Checkout vgi-polars
        uses: actions/checkout@v7
        with:
          path: vgi-polars

      - name: Checkout vgi-python (sibling)
        uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-python
          ref: ${{ github.event.inputs.vgi_python_ref || env.VGI_PYTHON_REF }}
          path: vgi-python
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync vgi-python
        working-directory: vgi-python
        run: uv sync --extra http

      # A plain `uv venv` + `uv pip install -e .[http]`, NOT `uv sync`: the
      # project's `dev` dependency group (mypy/ruff/pytest/...) has no lower
      # bounds at all -- it's tooling, never something an end user installs
      # via `pip install vgi-polars` -- so resolving IT to "lowest" would
      # pick genuinely ancient/broken releases (confirmed: mypy would
      # resolve to a Python 2-era package). Scoping to `-e .[http]` (the
      # package's own install requirements) is what makes "lowest-direct"
      # mean "the floor we actually publish," not "the floor of everything
      # in the repo, including dev tools nobody bounded on purpose."
      - name: Create minimum-versions venv
        working-directory: vgi-polars
        run: uv venv .venv-min --python 3.13

      - name: Install vgi-polars at its declared minimum versions
        working-directory: vgi-polars
        run: uv pip install --python .venv-min/bin/python --resolution lowest-direct -e ".[http]"

      - name: Install test tooling (unbounded is fine -- not part of the published floor)
        working-directory: vgi-polars
        run: uv pip install --python .venv-min/bin/python pytest pytest-cov

      - name: Run tests against the minimum-versions environment
        working-directory: vgi-polars
        env:
          VGI_PYTHON: ${{ github.workspace }}/vgi-python
        run: .venv-min/bin/python -m pytest -v
