[project]
name = "vgi-polars"
version = "0.3.3"
description = "Polars connector for VGI (Vector Gateway Interface) — scan VGI catalog tables and call VGI functions from Polars"
readme = "README.md"
keywords = [
    "polars",
    "apache-arrow",
    "arrow",
    "pyarrow",
    "vgi",
    "data-engineering",
    "analytics",
]
license = { file = "LICENSE" }
authors = [{ name = "Rusty Conover", email = "rusty@query.farm" }]
maintainers = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    # 1.41.1, not the previous 1.31 floor: DataFrame.gather() (used in
    # _row_transform.py) was only added in Polars ~1.41 -- 1.41.0 itself was
    # yanked from PyPI, so 1.41.1 is the actual earliest usable version.
    # Confirmed live (a real Colab install pinned in [1.31, 1.41) hit
    # AttributeError: 'DataFrame' object has no attribute 'gather').
    "polars>=1.41.1",
    # 18.0.0, not 17: pyarrow 17.0.0 ships no cp313 wheel at all (only up to
    # cp312), so "pyarrow>=17" was unsatisfiable against this package's own
    # requires-python = ">=3.13" -- found via the same minimum-versions
    # resolution check that caught the polars floor above.
    "pyarrow>=18",
    "vgi-python>=0.29.0",
]

[project.optional-dependencies]
http = ["vgi-python[http]"]

[project.urls]
Homepage = "https://github.com/Query-farm/vgi-polars"
Repository = "https://github.com/Query-farm/vgi-polars"
Issues = "https://github.com/Query-farm/vgi-polars/issues"
"VGI Protocol" = "https://github.com/Query-farm/vgi-python"

[dependency-groups]
# Includes the `http` extra so `uv sync` (no --extra needed) can run the
# HTTP-transport tests locally — vgi.client.Client's HTTP path imports
# vgi_rpc.http, which needs falcon (only pulled in via vgi-python[http]).
#
# pydoclint is intentionally NOT here, matching vgi-python's own pyproject.toml
# comment: it pulls docstring-parser-fork, which can clobber the canonical
# docstring-parser in the shared `docstring_parser` namespace. Run it isolated
# via `uvx pydoclint --config pyproject.toml src/` instead (see "Lint / Type
# Check" in CLAUDE.md).
dev = [
    "mypy",
    "pyarrow-stubs",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff",
    "vgi-polars[http]",
]

# Local sibling checkout, not (yet) the published PyPI release — vgi-polars
# tracks vgi-python's client-side surface as it develops, the same way
# vgi-spark's settings.gradle.kts composite-builds a sibling vgi-java checkout
# ahead of its own release. This means a `../vgi-python` checkout must exist
# next to this repo for `uv sync` to work (see CLAUDE.md's Build/Test section)
# — CI reproduces the same layout by checking out both repos as siblings.
[tool.uv.sources]
vgi-python = { path = "../vgi-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgi_polars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Adopted from vgi-python's own pyproject.toml (same rule set, same
# pydocstyle convention, same formatter settings) — this repo tracks
# vgi-python's client-side surface closely enough that its own lint/type/
# docstring bar is the right one to hold vgi-polars to as well.
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]

# Test functions/fixtures aren't documented the way public src/ API is —
# vgi-python suppresses the same rules per-file via inline `# ruff: noqa:`
# comments; a blanket per-file-ignore here is equivalent and less repetitive
# across ~20 test files. D100/D103 = missing module/function docstring,
# D101/D102 = missing class/method docstring.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pydoclint]
# Docstring consistency gate (complements ruff's `D` rules, which only check
# docstring *shape*, not whether documented args/attributes match the code).
# NOT a project dependency (see the `dev` group comment above) — run isolated:
#   uvx pydoclint --config pyproject.toml src/
style = "google"
# We keep types in signatures, not docstrings (Google style) — so don't ask
# for them in docstrings, and don't try to match return/yield *types* against
# prose.
arg_type_hints_in_docstring = false
check_return_types = false
check_yield_types = false
check_class_attributes = true
# Raises (DOC5xx) are intentionally not gated, matching vgi-python: this
# codebase's docstrings describe exceptions in prose, not a formal `Raises:`
# section pydoclint can cross-check against actual `raise` statements.
skip_checking_raises = true
# Document constructor params in the class docstring, not __init__.
allow_init_docstring = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true
