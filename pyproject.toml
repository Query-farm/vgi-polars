[project]
name = "vgi-polars"
version = "0.1.0"
description = "Polars connector for VGI (Vector Gateway Interface) — scan VGI catalog tables and call VGI functions from Polars"
readme = "README.md"
keywords = [
    "polars",
    "apache-arrow",
    "arrow",
    "pyarrow",
    "vgi",
    "data-engineering",
    "analytics",
]
license = { file = "LICENSE" }
authors = [{ name = "Rusty Conover", email = "rusty@query.farm" }]
maintainers = [{ name = "Query Farm LLC", email = "hello@query.farm" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "polars>=1.31",
    "pyarrow>=17",
    "vgi-python>=0.29.0",
]

[project.optional-dependencies]
http = ["vgi-python[http]"]

[project.urls]
Homepage = "https://github.com/Query-farm/vgi-polars"
Repository = "https://github.com/Query-farm/vgi-polars"
Issues = "https://github.com/Query-farm/vgi-polars/issues"
"VGI Protocol" = "https://github.com/Query-farm/vgi-python"

[dependency-groups]
# Includes the `http` extra so `uv sync` (no --extra needed) can run the
# HTTP-transport tests locally — vgi.client.Client's HTTP path imports
# vgi_rpc.http, which needs falcon (only pulled in via vgi-python[http]).
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff",
    "vgi-polars[http]",
]

# Local sibling checkout, not (yet) the published PyPI release — vgi-polars
# tracks vgi-python's client-side surface as it develops, the same way
# vgi-spark's settings.gradle.kts composite-builds a sibling vgi-java checkout
# ahead of its own release. This means a `../vgi-python` checkout must exist
# next to this repo for `uv sync` to work (see CLAUDE.md's Build/Test section)
# — CI reproduces the same layout by checking out both repos as siblings.
[tool.uv.sources]
vgi-python = { path = "../vgi-python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgi_polars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pinned explicitly rather than left to ruff's version-dependent defaults —
# discovered live that the globally-installed ruff (0.15.18) and the
# project-resolved ruff (0.16.4) disagreed sharply on what "default" means
# (0.16 silently enables a much broader rule set with no config present).
# This is ruff's own documented default selection (pyflakes + a pycodestyle
# subset), made explicit so a future ruff version can't silently change what
# this repo is checked against in either direction. `select = ["ALL"]` was
# tried and reverted: it fires S101 (no `assert`) on every pytest test and
# PLR2004 (no magic values) on every literal in a comparison — appropriate
# for production code, not a test suite using plain `assert`.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
